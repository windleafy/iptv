<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV-1 综合频道（Vercel 专版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        /* 裁剪外壳容器 */
        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw; 
            max-height: 100vh;
            max-width: 177.78vh;
            margin: 0 auto;
            top: 50%;
            transform: translateY(-50%); 
            overflow: hidden;
            background-color: #000;
        }

        /* 精密微调后的 iframe */
        .video-wrapper iframe {
            position: absolute;
            border: none;
            
            /* 向上推 125 像素，完美切掉顶部导航 */
            top: -125px; 
            
            /* 向左移动 15 像素 */
            left: -15px; 
            
            /* 强制把右侧节目单挤出可视区域 */
            width: calc(100% + 430px) !important; 
            
            /* 拉高高度 */
            height: calc(100% + 260px) !important; 
        }

        /* 强力底部遮罩，死死挡住下方太行谣广告 */
        .bottom-shield {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px; 
            background-color: #000;
            z-index: 9999;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <iframe 
            src="https://tv.cctv.com/live/cctv1/?spm=C28340.PALq7Iyxwdh3.ExidtyEJcS5K.1" 
            scrolling="no" 
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true"
            referrerpolicy="no-referrer">
        </iframe>
        
        <div class="bottom-shield"></div>
    </div>

</body>
</html>
