<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV-1 综合频道（免配置直亮版）</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        /* 让播放器铺满整个 Vercel 页面 */
        #artplayer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="artplayer"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

    <script>
        var art = new Artplayer({
            container: '#artplayer',
            // 核心在这里：这是一个由社区实时向央视鉴权、不限制任何公网域名嵌套的 CCTV1 纯视频流
            url: 'https://live.fan/cctv1.m3u8', 
            type: 'm3u8',
            fullscreen: true,
            fullscreenWeb: true,
            autoSize: true,
            autoMini: true,
            isLive: true, // 声明是电视直播流
            customType: {
                m3u8: function (video, url) {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    }
                },
            },
        });
    </script>
</body>
</html>
