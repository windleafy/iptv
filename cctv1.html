<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV-1 综合频道（移动端高兼容纯净版）</title>
    <style>
        /* 简单粗暴：让全局和容器全部 100% 满屏铺满，不留一点缝隙 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .player-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <iframe 
            src="https://vdn.apps.cntv.cn/api/getLiveUrlCommonApi?channel=cctv1&source=html5" 
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true"
            referrerpolicy="no-referrer">
        </iframe>
    </div>

</body>
</html>
